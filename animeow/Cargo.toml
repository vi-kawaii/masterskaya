[package]
name = "animeow"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools"] }
bevy_asset.workspace = true
blake3 = { version = "1.8", features = ["pure"] }
avian3d = "0.7"
bevy_asset_loader = "0.27"
lab-app-shell = { path = "../libs/app-shell" }

# ВЕРСИИ ДЛЯ BEVY 0.19
bevy-tnua = "0.32"
bevy-tnua-avian3d = "0.12"

[profile.dev.package."*"]
opt-level = 3
